name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SchoolWeb.sln

      - name: Build (warnings as errors)
        run: dotnet build SchoolWeb.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test SchoolWeb.sln -c Release --no-build --verbosity normal
